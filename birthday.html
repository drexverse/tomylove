<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="birthday.css" />
  </head>
  <body class="birthday-page">
    <div class="reveal-overlay" aria-hidden="true"></div>
    <div class="floating-hearts" aria-hidden="true"></div>
    <div class="balloon-cluster" aria-hidden="true"></div>
    <div class="confetti-layer" aria-hidden="true"></div>
    <div class="sparkle-ring" aria-hidden="true"></div>

    <main class="birthday-shell fade-in">
      <div class="birthday-content">
        <div class="reveal-glow" aria-hidden="true"></div>
        <h1 class="birthday-title">HAPPY BIRTHDAY! <br /> ❤️</h1>
        <p class="birthday-message">Today is special because you are special to me. ❤️</p>
        <p class="birthday-subtitle">Happy Birthday, my loving lil Angel Panchiiii! ♡</p>
        <p class="signed-message">Made with love,<br />just for you.</p>
      </div>
    </main>

    <script src="birthday.js"></script>
  </body>
</html>
